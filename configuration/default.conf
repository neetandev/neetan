; neetan - Japanese computer emulator configuration
;
; Load with: neetan --config default.conf
; Lines starting with ; or # are comments.
; Format: key = value

; ---------------------------------------------------------------------------
; Machine
; ---------------------------------------------------------------------------

; Machine type: PC9801F  (PC-9801F, 8086 5/8 MHz)
;               PC9801VM (PC-9801VM, V30 8/10 MHz)
;               PC9801VX (PC-9801VX, 80286 8/10 MHz)
;               PC9801RS (PC-9801RS, 80386SX 16 MHz)
;               PC9801RA (PC-9801RA, 80386DX 20 MHz)
;               PC9821AS (PC-9821AS, 80486DX)
;               PC9821AP (PC-9821AP, 80486DX2)
;               PC8801MC (PC-8801MC, Z80 4/8 MHz, requires pc88-roms)
;               PC88VA2  (PC-88VA2, V30 ~8 MHz, requires pc88va-roms)
;               PC6001      (PC-6001, Z80 ~4 MHz, requires pc6000-roms)
;               PC6001MK2   (PC-6001mkII, Z80 ~4 MHz, requires pc6000-roms)
;               PC6601      (PC-6601, Z80 ~4 MHz, requires pc6000-roms)
;               PC6001MK2SR (PC-6001mkIISR, Z80 ~3.58 MHz, requires pc6000-roms)
;               PC6601SR    (PC-6601SR, Z80 ~3.58 MHz, requires pc6000-roms)
;               FMTowns     (FM Towns, 80386SX 16 MHz, requires towns-roms)
;               FMTownsIICX (FM Towns II CX, 80386DX 16/20 MHz, requires towns-roms)
;               FMTownsIIMX (FM Towns II MX, 80486DX2 33/66 MHz, requires towns-roms)
;               X68000      (Sharp X68000, MC68000 10 MHz, requires x68k-roms)
;               X68000SUPER (Sharp X68000 SUPER, MC68000 10 MHz, requires x68k-roms)
;               X68000XVI   (Sharp X68000 XVI, MC68000 10/16.67 MHz, requires x68k-roms)
;               X1          (Sharp X1, Z80 ~4 MHz, requires x1-roms)
;               X1TURBO     (Sharp X1 turbo, Z80 ~4 MHz, requires x1-roms)
;               FM7         (Fujitsu FM-7, 2x MC68B09, requires fm7-roms)
;               FM77AV      (Fujitsu FM-77AV, 2x MC68B09, requires fm7-roms)
; machine = PC9801RA

; CPU speed mode: low or high (default: high).
; Machine speeds:
;   PC9801F: low = 5 MHz, high = 8 MHz
;   PC9801VM: low = 8 MHz, high = 10 MHz
;   PC9801VX: low = 8 MHz, high = 10 MHz
;   PC9801RS: fixed 16 MHz, ignores cpu-mode
;   PC9801RA: fixed 20 MHz, ignores cpu-mode
;   PC9821AS/PC9821AP: fixed speed, ignores cpu-mode
;   X68000XVI: low = 10 MHz, high = 16.67 MHz
;   PC-6000 targets: fixed clock, ignores cpu-mode
;   X1 targets: fixed clock, ignores cpu-mode
;   FM-7 targets: fixed clock, ignores cpu-mode
;   FMTowns: fixed 16 MHz, ignores cpu-mode
;   FMTownsIICX: low = 16 MHz (canonical CX), high = 20 MHz (HG-class speed)
;   FMTownsIIMX: low = 33 MHz (MA-class speed), high = 66 MHz (canonical MX)
; cpu-mode = high

; Boot mode; each machine family accepts only its own values.
;   PC-8801: v1s, v1h, v2 (default), n, n80, n80sr
;   FM-7:    basic (default), dos
; boot-mode = v2

; PC-8801 memory wait: fast or compatible. The default derives from the boot
; mode (compatible for v1s and the N modes, fast otherwise).
; pc88-memory-wait = fast

; PC-8801 8 MHz wait: fast or compatible (default: fast).
; pc88-8mhz-wait = fast

; ---------------------------------------------------------------------------
; Disk images
; ---------------------------------------------------------------------------

; Floppy disk images for drive 1 and 2 (repeatable for multi-disk games).
; Supported formats: D88 (.d88/.d98/.88d/.98d), HDM (.hdm), NFD (.nfd), 2D (.2d),
; D77 (.d77), DIM (.dim), XDF (.xdf/.2hd)
; fdd1 = path/to/disk.d88
; fdd2 = path/to/disk2.d88

; Hard disk images for drive 1 and 2. Each machine family accepts its own formats:
;   PC-98:    HDI (.hdi), NHD (.nhd), THD (.thd); SASI on PC9801F/VM/VX/RS/RA,
;             IDE on PC9821AS/AP
;   FM Towns: raw SCSI images (.h0-.h4)
;   X68000:   headerless HDF images (.hdf); SASI on X68000,
;             SCSI on X68000 SUPER/XVI
; Empty images can be created with 'neetan create-hdd'.
; hdd1 = path/to/hdd.hdi
; hdd2 = path/to/hdd2.hdi

; CD-ROM disc image (repeatable, PC-9821, FM Towns and X68000 SUPER/XVI).
; Supported formats: CUE/BIN (.cue), CloneCD (.ccd with sibling .img and optional .sub)
; cdrom = path/to/game.cue

; Slow/compatible CD-ROM drive timing (FM Towns only): on or off (default: off).
; cdrom-compat = off

; Cartridge images (currently used by the PC-6000 targets) and cassette images
; (PC-6000, Sharp X1, and FM-7 targets).
; cartridge = path/to/cart.rom
; cassette = path/to/tape.cas        ; .cas/.p6/.p6t; X1 .tap; FM-7 .t77
; Initial composite artifact-color phase (0-3); swaps the fake-color pair used by
; Mode 4 titles such as Portopia. Cycle it live with Right Ctrl + P.
; pc6000-phase = 0

; ---------------------------------------------------------------------------
; Boot device
; ---------------------------------------------------------------------------

; Boot device selection: auto, fdd1, fdd2, hdd1, hdd2, dos
;   auto: try all devices in standard order (FDD 1-2, CD-ROM, HDD 1-2, then DOS)
;   fdd1/fdd2: boot from the given floppy drive only
;   hdd1/hdd2: boot from the given hard disk drive only
;   dos: skip all disk boot attempts and go straight to the HLE DOS
; boot-device = auto

; ---------------------------------------------------------------------------
; Memory
; ---------------------------------------------------------------------------

; Enable EMS expanded memory (PC-98 HLE DOS): on or off (default: on).
; ems = on

; Enable XMS extended memory (PC-98 HLE DOS): on or off (default: on).
; xms = on

; ---------------------------------------------------------------------------
; Display
; ---------------------------------------------------------------------------

; Display aspect mode: 4:3 or 1:1
; aspect-mode = 4:3

; Window mode: windowed or fullscreen
; window-mode = windowed

; Monitor timing (PC-8801 and X1 turbo): auto, 15k, 24k (default: auto).
;   auto: PC-88 follows the software line mode; X1 reports a 24 kHz monitor so
;         hi-res software runs at 400 lines.
;   15k:  force a 15 kHz (200-line) monitor.
;   24k:  force a 24 kHz (400-line) monitor.
; monitor = auto

; CRT effect: on or off
; crt = on

; Scaling method: nearest, bilinear, pixelart (default: pixelart)
; scaling = pixelart

; Rendering backend: modern or legacy.
; modern: hardware-accelerated, supports advance filtering and shader effects.
; legacy: fallback option; bilinear scaling, no shaders effects.
; If modern is selected but the modern backend can't be initialized, the
; legacy backend is used automatically.
; backend = modern

; Force GDC clock to 2.5 MHz or 5 MHz (default: auto-detect).
; Auto-detect starts at 2.5 MHz and switches to 5 MHz when software
; requests 400-line mode via BIOS or port 0x6A.
; VM always uses 2.5 MHz regardless of this setting.
; force-gdc-clock = 2.5

; ---------------------------------------------------------------------------
; Audio
; ---------------------------------------------------------------------------

; Audio volume (0.0 to 1.0)
; audio-volume = 1.0

; ---------------------------------------------------------------------------
; ROMs
; ---------------------------------------------------------------------------

; ROMs are loaded from officially released MAME ROM sets; just extract the set(s)
; for your machine into a directory. Files are matched by BLAKE3 content hash, so
; file names do not matter. See doc/roms.md for which set each machine needs and a
; script that builds this layout.

; PC-98 ROM set directory. Holds the pc9801f/pc9801vm/pc9801vx/pc9801rs MAME sets
; (all PC-98 models share one directory). The BIOS is assembled from the model's
; chips. All ROMs are optional; without them the built-in HLE BIOS and font are used.
; pc98-roms = roms/pc98

; Boot the real BIOS from pc98-roms instead of the HLE BIOS. When on, the model's
; real BIOS (and, with a 26K sound board, the sound ROM) is assembled from pc98-roms.
; A font ROM in that directory is used automatically when present. The PC-9821
; targets have no real-BIOS boot path and always run HLE.
; bios = off

; PC-88 family ROM sets (required for the PC-88 targets).
; pc88-roms = roms/pc88       ; MAME set pc8801mc (+ pc8001mk2/pc8001mk2sr for N80)
; pc88va-roms = roms/pc88va   ; MAME set pc88va2 (sub-CPU ROM sourced separately)
; pc6000-roms = roms/pc6000   ; MAME sets pc6001 .. pc6601sr

; Sharp X1 ROM set (required for the X1 targets; MAME sets x1/x1turbo).
; x1-roms = roms/x1

; X1 turbo keyboard mode switch: A (standard) or B (mode-B kana layout, games
; can read the key matrix through the sub-CPU game-key command).
; x1-keyboard = A

; Fujitsu FM-7 / FM-77AV ROM set (required for the FM-7 targets; MAME sets
; fm7/fm77av, which can share the directory).
; fm7-roms = roms/fm7

; FM Towns ROM set (required for the FM Towns targets; MAME set fmtownsmx).
; Accepts the packed MAME "fmtownsiimxbios.m79" plus "mytownsmx.rom", or the
; loose FMT_SYS/DOS/FNT/DIC/F20.ROM file set. The CX target boots the shared
; MX ROM set until a CX-specific dump exists.
; towns-roms = roms/fmtowns

; Sharp X68000 ROM set (required for X68000 targets; MAME sets x68000,
; x68ksupr, and x68kxvi).
; x68k-roms = roms/x68k

; FM Towns game pad type: 2 (2-button) or 6 (6-button).
; towns-pad = 6

; ---------------------------------------------------------------------------
; Sound board
; ---------------------------------------------------------------------------

; Sound board type: none, 14 (PC-9801-14 TMS3631), 26k (YM2203 OPN),
;                   86 (YM2608 OPNA + PCM86), 86+26k (both boards),
;                   sb16 (Sound Blaster 16), sb16+26k (both boards)
; soundboard = 86+26k

; ADPCM RAM option for the PC-9801-86 board: on or off (default: on).
; adpcm-ram = on

; ---------------------------------------------------------------------------
; Graphics accelerator board
; ---------------------------------------------------------------------------

; Graphics accelerator board: none, ga1280a (I-O DATA GA-1280A).
; The GA-1280A enables high-resolution Windows 3.1 modes up to 1600x1024.
; graphicboard = none

; ---------------------------------------------------------------------------
; MIDI
; ---------------------------------------------------------------------------

; MIDI device: none, mt32, sc55 (default: none).
; Supported on both the PC-98 and FM Towns families.
; midi = none

; ---------------------------------------------------------------------------
; MT-32 sound module (requires "mt32" feature, enabled by default)
; ---------------------------------------------------------------------------

; Path to directory containing Roland MT-32 ROM files (control + PCM ROM).
; MT-32 emulation is only activated when both midi = mt32 and mt32-roms are set.
; Control ROM v1.07 is recommended. See doc/roms.md for accepted versions.
; mt32-roms = roms/mt32

; ---------------------------------------------------------------------------
; SC-55 sound module (requires "sc55" feature, enabled by default)
; ---------------------------------------------------------------------------

; Path to directory containing Roland SC-55 ROM files (matched by file name).
; SC-55 emulation is only activated when both midi = sc55 and sc55-roms are set.
; SC-55 v1.21 is recommended. See doc/roms.md for supported models.
; sc55-roms = roms/sc55

; ---------------------------------------------------------------------------
; Printer
; ---------------------------------------------------------------------------

; Output file for printer (file must already exist).
; printer = /tmp/printer.txt

; ---------------------------------------------------------------------------
; Text extractor
; ---------------------------------------------------------------------------

; Copy on-screen text to the system clipboard (PC-98): on or off (default: off).
; enable-extractor = off

; ---------------------------------------------------------------------------
; Key bindings
; ---------------------------------------------------------------------------
;
; Format: key.<HostKey> = <PC-98 Key>
;
; Override individual keys. Only the keys you list here are changed;
; everything else keeps its default mapping shown below.
;
; Host key names (left side) match SDL physical scancodes:
;   Escape, 1-9, 0, Minus, Equals, Backslash, Backspace, Tab,
;   A-Z, Return, LeftBracket, RightBracket, Grave, Semicolon, Apostrophe,
;   NonUsBackslash, Comma, Period, Slash, Space,
;   PageUp, PageDown, Insert, Delete, Up, Left, Right, Down, Home, End,
;   KpMinus, KpDivide, Kp0-Kp9, KpMultiply, KpPlus, KpEnter, KpComma,
;   KpPeriod, F1-F15, PrintScreen, Pause, NumLock, Application,
;   LShift, RShift, CapsLock, LAlt, RAlt, LCtrl, RCtrl
;
; PC-98 key names (right side):
;   Esc, 1-9, 0, Minus, Caret, Yen, Bs, Tab,
;   A-Z, Return, At, LeftBracket, RightBracket, Semicolon, Colon,
;   Comma, Period, Slash, Underscore, Space,
;   Xfer, Nfer, RollUp, RollDown, Ins, Del,
;   Up, Left, Right, Down, Home, Help,
;   KpMinus, KpDivide, Kp0-Kp9, KpMultiply, KpPlus, KpEquals, KpComma,
;   KpPeriod, F1-F10, Vf1-Vf5, Stop, Copy,
;   Shift, Caps, Kana, Grph, Ctrl
;
; Examples:
;   key.RAlt = Grph          ; Use RAlt as GRPH instead of XFER
;   key.PageUp = RollDown    ; MAME-style functional PgUp/PgDn mapping
;   key.PageDown = RollUp

