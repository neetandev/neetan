[package]
name = "machine_factory"
version.workspace = true
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["all-machines"]
# One feature per emulated machine family, named after the family's CLI symbol.
pc98 = ["dep:machine_98"]
pc88 = ["dep:machine_88"]
pc88va = ["dep:machine_88va"]
pc60 = ["dep:machine_60"]
msx = ["dep:machine_msx"]
towns = ["dep:machine_towns"]
x1 = ["dep:machine_x1"]
fm7 = ["dep:machine_fm7"]
x68k = ["dep:machine_x68k"]
at = ["dep:machine_at"]
all-machines = ["pc98", "pc88", "pc88va", "pc60", "msx", "towns", "x1", "fm7", "x68k", "at"]
# The weak `?/` form keeps a MIDI module from pulling a machine crate back in.
mt32 = ["machine_98?/mt32", "machine_towns?/mt32", "machine_x68k?/mt32", "machine_at?/mt32"]
sc55 = ["machine_98?/sc55", "machine_towns?/sc55", "machine_x68k?/sc55", "machine_at?/sc55"]

[dependencies]
common = { workspace = true, features = ["std"] }
device = { workspace = true }
machine_98 = { workspace = true, optional = true }
machine_at = { workspace = true, optional = true }
machine_60 = { workspace = true, optional = true }
machine_88 = { workspace = true, optional = true }
machine_88va = { workspace = true, optional = true }
machine_fm7 = { workspace = true, optional = true }
machine_msx = { workspace = true, optional = true }
machine_towns = { workspace = true, optional = true }
machine_x68k = { workspace = true, optional = true }
machine_x1 = { workspace = true, optional = true }
