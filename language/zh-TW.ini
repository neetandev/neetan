help = 存放所有系統ROM資料夾的資料夾。預設資料夾位於根目錄中。

[setting.gui-font]
label = GUI字型
help = 使用者介面的字型檔。預設字型會先在根目錄下尋找，再到安裝位置的資源資料夾尋找。

[setting.at-roms]
label = PC/AT
help = 存放此系統ROM組的資料夾。所有ROM皆可省略。

[setting.fm7-roms]
label = FM-7
help = 存放此系統ROM組的資料夾（必要）。

