name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all -- --check

  check:
    name: Check (${{ matrix.name }})
    needs: fmt
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: Windows x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - name: macOS aarch64 (15)
            runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold cmake \
            libasound2-dev libpulse-dev libjack-dev libpipewire-0.3-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libwayland-dev libdecor-0-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev libvulkan-dev

      - name: Clippy
        run: cargo clippy --workspace --all-targets --features sdl3-build-from-source -- -D warnings

      - name: Test
        run: cargo test --workspace --features sdl3-build-from-source

      - name: Check machine builds
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for machine in pc98 pc88 pc88va pc60 msx towns x1 fm7 x68k at; do
            echo "::group::gui,auto,$machine"
            cargo check -p neetan --no-default-features \
              --features "gui,auto,$machine,sdl3-build-from-source"
            echo "::endgroup::"
          done
          echo "::group::gui only, all machines"
          cargo check -p neetan --no-default-features \
            --features "gui,all-machines,sdl3-build-from-source"
          echo "::endgroup::"
          echo "::group::auto only, all machines"
          cargo check -p neetan --no-default-features --features "auto,all-machines"
          echo "::endgroup::"
