name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # A tag push builds the version of the tag. A manual run builds a test version named after its run number.
  RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_number) }}

jobs:
  build-windows:
    name: Build (Windows x86_64)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release
        run: cargo build --release --features sdl3-build-from-source

      - name: Locate SDL3 shared library
        id: sdl3
        shell: bash
        run: |
          SDL3_LIB=$(find target/release/build -path "*sdl3-sys*" \
            -name "SDL3.dll" \
            -not -name "*.a" \
            -not -name "*.lib" \
            -not -type l \
            | head -1)
          if [ -z "$SDL3_LIB" ]; then
            echo "::error::Could not find SDL3 shared library"
            find target/release/build -path "*sdl3*" -ls
            exit 1
          fi
          echo "path=$SDL3_LIB" >> "$GITHUB_OUTPUT"
          echo "Found SDL3 library: $SDL3_LIB"

      - name: Prepare archive
        shell: bash
        run: |
          VERSION="${RELEASE_VERSION#v}"
          ARCHIVE_NAME="neetan-${VERSION}-x86_64-pc-windows-msvc"
          STAGE="staging/${ARCHIVE_NAME}"
          mkdir -p "${STAGE}"
          cp "target/release/neetan.exe" "${STAGE}/"
          cp "target/release/neetan-auto.exe" "${STAGE}/"
          cp "${{ steps.sdl3.outputs.path }}" "${STAGE}/"
          cp -r font/ "${STAGE}/"
          cp -r language/ "${STAGE}/"
          : > "${STAGE}/neetan.conf"
          for SYSTEM in pc98 pc88 pc88va pc6000 x68k towns x1 fm7 msx at; do
            mkdir -p "${STAGE}/config/${SYSTEM}" "${STAGE}/roms/${SYSTEM}"
          done
          mkdir -p "${STAGE}/roms/mt32" "${STAGE}/roms/sc55"
          cp -r licenses/ "${STAGE}/"
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      - name: Create archive
        shell: bash
        run: |
          cd staging
          7z a -tzip "${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}"
          echo "ARCHIVE_FILE=staging/${ARCHIVE_NAME}.zip" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_FILE }}

  build-linux:
    name: Build (Linux x86_64 AppImages)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold cmake libfuse2 zip \
            libasound2-dev libpulse-dev libjack-dev libpipewire-0.3-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libwayland-dev libdecor-0-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev libvulkan-dev

      - name: Build release
        run: cargo build --release --features sdl3-build-from-source

      - name: Locate SDL3 shared library
        id: sdl3
        run: |
          SDL3_LIB=$(find target/release/build -path "*sdl3-sys*" \
            -name "libSDL3.so*" \
            -not -name "*.a" \
            -not -type l \
            | head -1)
          if [ -z "$SDL3_LIB" ]; then
            echo "::error::Could not find SDL3 shared library"
            find target/release/build -path "*sdl3*" -ls
            exit 1
          fi
          echo "path=$SDL3_LIB" >> "$GITHUB_OUTPUT"
          echo "Found SDL3 library: $SDL3_LIB"

      - name: Download linuxdeploy
        run: |
          curl -fsSL -o "$RUNNER_TEMP/linuxdeploy" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod +x "$RUNNER_TEMP/linuxdeploy"

      - name: Build AppImages
        env:
          DISABLE_COPYRIGHT_FILES_DEPLOYMENT: "1"
        run: |
          VERSION="${RELEASE_VERSION#v}"
          SDL3_PATH="${{ steps.sdl3.outputs.path }}"

          # Builds the AppImage of one executable: build_appimage <name> <desktop file> <output file>.
          build_appimage() {
            local NAME="$1"
            local DESKTOP_FILE="$2"
            local OUTPUT="$3"
            local APPDIR="$RUNNER_TEMP/${NAME}.AppDir"
            local WORKDIR="$RUNNER_TEMP/${NAME}-build"

            mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/lib" "$APPDIR/usr/share/licenses/neetan" "$WORKDIR"
            cp "target/release/${NAME}" "$APPDIR/usr/bin/"
            cp "$SDL3_PATH" "$APPDIR/usr/lib/"
            ln -sf "$(basename "$SDL3_PATH")" "$APPDIR/usr/lib/libSDL3.so.0"
            cp -r licenses/* "$APPDIR/usr/share/licenses/neetan/"

            (
              cd "$WORKDIR"
              LINUXDEPLOY_OUTPUT_VERSION="$VERSION" \
              LD_LIBRARY_PATH="$APPDIR/usr/lib:${LD_LIBRARY_PATH:-}" \
              "$RUNNER_TEMP/linuxdeploy" \
                --appdir "$APPDIR" \
                --executable "$GITHUB_WORKSPACE/target/release/${NAME}" \
                --desktop-file "$GITHUB_WORKSPACE/${DESKTOP_FILE}" \
                --icon-file "$GITHUB_WORKSPACE/assets/neetan.png" \
                --exclude-library "libvulkan*" \
                --exclude-library "libGLX*" \
                --exclude-library "libGLdispatch*" \
                --exclude-library "libOpenGL*" \
                --exclude-library "libEGL*" \
                --exclude-library "libwayland-client*" \
                --output appimage
            )

            local GENERATED
            GENERATED=$(ls -1 "$WORKDIR"/*.AppImage 2>/dev/null | head -1)
            if [ -z "$GENERATED" ]; then
              echo "::error::AppImage of ${NAME} was not created"
              ls -la "$WORKDIR"
              exit 1
            fi
            mv "$GENERATED" "$OUTPUT"
            chmod +x "$OUTPUT"
          }

          mkdir -p "$RUNNER_TEMP/neetan.AppDir/usr/share/metainfo"
          mkdir -p "$RUNNER_TEMP/neetan.AppDir/usr/share/neetan/font"
          mkdir -p "$RUNNER_TEMP/neetan.AppDir/usr/share/neetan/language"
          cp font/SarasaUiJ-Regular.ttf "$RUNNER_TEMP/neetan.AppDir/usr/share/neetan/font/"
          cp language/*.ini "$RUNNER_TEMP/neetan.AppDir/usr/share/neetan/language/"
          cp assets/neetan.metainfo.xml "$RUNNER_TEMP/neetan.AppDir/usr/share/metainfo/"

          ARCHIVE_NAME="neetan-${VERSION}-x86_64-linux"
          STAGE="$RUNNER_TEMP/${ARCHIVE_NAME}"
          mkdir -p "$STAGE"

          build_appimage neetan assets/neetan.desktop "$STAGE/neetan-${VERSION}-x86_64.AppImage"
          build_appimage neetan-auto assets/neetan-auto.desktop "$STAGE/neetan-auto-${VERSION}-x86_64.AppImage"

          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"
          echo "STAGE=${STAGE}" >> "$GITHUB_ENV"

      - name: Create archive
        run: |
          : > "${STAGE}/neetan.conf"
          for SYSTEM in pc98 pc88 pc88va pc6000 x68k towns x1 fm7 msx at; do
            mkdir -p "${STAGE}/config/${SYSTEM}" "${STAGE}/roms/${SYSTEM}"
          done
          mkdir -p "${STAGE}/roms/mt32" "${STAGE}/roms/sc55"
          cp -r licenses/ "${STAGE}/"
          (cd "$RUNNER_TEMP" && zip -r "$GITHUB_WORKSPACE/${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}")
          echo "ARCHIVE_FILE=${ARCHIVE_NAME}.zip" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_FILE }}

  release:
    name: Publish Release
    needs: [ build-windows, build-linux ]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Update release draft and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          # Find the draft release created by release-drafter.
          DRAFT_ID=$(gh api repos/${GH_REPO}/releases \
            --jq '.[] | select(.draft == true) | .id' \
            | head -1)

          if [ -n "$DRAFT_ID" ]; then
            # Update the draft: set the tag, name, and publish it.
            gh api -X PATCH "repos/${GH_REPO}/releases/${DRAFT_ID}" \
              -f tag_name="${TAG}" \
              -f name="${TAG}" \
              -F draft=false
            RELEASE_ID="$DRAFT_ID"
            echo "Published existing draft release (id=${RELEASE_ID})"
          else
            # No draft found - create a new release with auto-generated notes.
            RELEASE_ID=$(gh api repos/${GH_REPO}/releases \
              -f tag_name="${TAG}" \
              -f name="${TAG}" \
              -F generate_release_notes=true \
              -F draft=false \
              --jq '.id')
            echo "Created new release (id=${RELEASE_ID})"
          fi

          # Upload all artifacts to the release.
          for FILE in artifacts/*; do
            echo "Uploading ${FILE}..."
            gh release upload "${TAG}" "${FILE}" --clobber
          done
