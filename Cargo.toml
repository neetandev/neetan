[workspace]
resolver = "3"
members = ["crates/*", "utils/create_font"]

[workspace.package]
authors = ["Nils Hasenbanck <nils@hasenbanck.de>"]
edition = "2024"
license = "BSD-3-Clause"
rust-version = "1.95"
version = "2026.7.0"

[workspace.dependencies]
# Internal dependencies
audio_engine = { path = "crates/audio_engine" }
blake3 = { path = "crates/blake3" }
common = { path = "crates/common" }
cpu = { path = "crates/cpu" }
cpu_68k = { path = "crates/cpu_68k" }
device = { path = "crates/device" }
dos = { path = "crates/dos" }
machine_98 = { path = "crates/machine_98" }
machine_at = { path = "crates/machine_at" }
machine_60 = { path = "crates/machine_60" }
machine_88 = { path = "crates/machine_88" }
machine_88va = { path = "crates/machine_88va" }
machine_fm7 = { path = "crates/machine_fm7" }
machine_towns = { path = "crates/machine_towns" }
machine_x68k = { path = "crates/machine_x68k" }
machine_x1 = { path = "crates/machine_x1" }
resampler = { path = "crates/resampler" }
save_state = { path = "crates/save_state" }
sdl3 = { path = "crates/sdl3" }
sdl3_backend = { path = "crates/sdl3_backend" }
software_renderer = { path = "crates/software_renderer" }
softfloat = { path = "crates/softfloat" }
text_extractor = { path = "crates/text_extractor" }
munt_oxide = { path = "crates/munt_oxide" }
nuked_sc55_oxide = { path = "crates/nuked_sc55_oxide" }
ymfm_oxide = { path = "crates/ymfm_oxide" }
# External dependencies
sdl3-sys = "0.6"
# Dependencies only used for the CPU verification tests
zlib-rs = { version = "0.6", default-features = false, features = ["rust-allocator"] }

[package]
name = "neetan"
version.workspace = true
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["mt32", "sc55"]
mt32 = ["machine_98/mt32", "machine_towns/mt32", "machine_x68k/mt32", "machine_at/mt32"]
sc55 = ["machine_98/sc55", "machine_towns/sc55", "machine_x68k/sc55", "machine_at/sc55"]
tracing = []
sdl3-build-from-source = ["sdl3/build-from-source"]
sdl3-use-pkg-config = ["sdl3/use-pkg-config"]
sdl3-use-vcpkg = ["sdl3/use-vcpkg"]

[dependencies]
audio_engine = { workspace = true }
cpu = { workspace = true }
common = { workspace = true, features = ["std"] }
device = { workspace = true }
machine_98 = { workspace = true }
machine_at = { workspace = true }
machine_60 = { workspace = true }
machine_88 = { workspace = true }
machine_88va = { workspace = true }
machine_fm7 = { workspace = true }
machine_towns = { workspace = true }
machine_x68k = { workspace = true }
machine_x1 = { workspace = true }
dos = { workspace = true }
save_state = { workspace = true }
sdl3 = { workspace = true }
sdl3_backend = { workspace = true }
software_renderer = { workspace = true }
text_extractor = { workspace = true }

[dev-dependencies]

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
strip = true

[profile.dev]
opt-level = 0
overflow-checks = true

[profile.dev.package."*"]
opt-level = 3
codegen-units = 1

[profile.dev.package.audio_engine]
opt-level = 3
codegen-units = 1

[profile.dev.package.blake3]
opt-level = 3
codegen-units = 1

